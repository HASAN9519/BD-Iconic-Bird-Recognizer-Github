<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BD Iconic Bird Recognizer</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    p {
      color: #ccc;
      font-size: 1rem;
    }
    input[type="file"] {
      margin-top: 1rem;
      color: #e0e0e0;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #2d6a4f;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover {
      background-color: #40916c;
    }

    #preview {
      max-width: 300px;
      display: none;
      border: 2px solid #444;
      border-radius: 8px;
      margin-top: 20px;
    }
    #result {
      margin-top: 30px;
      font-size: 16px;
      color: #e0e0e0;
      text-align: left;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .confidence-bar {
      background: #333;
      height: 14px;
      border-radius: 6px;
      overflow: hidden;
      max-width: 300px;
      margin: 4px 0;
    }
    .confidence-fill {
      height: 100%;
    }
  </style>

  <script type="module">
    import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@latest/dist/index.min.js";

    async function predictBird() {
      const fileInput = document.getElementById("imageUpload");
      const preview = document.getElementById("preview");
      const resultDiv = document.getElementById("result");

      if (!fileInput.files.length) {
        resultDiv.innerText = "Please upload an image first.";
        return;
      }

      const file = fileInput.files[0];
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";

      try {
        const client = await Client.connect("Hasan9519/BD-Iconic-Bird-Recognizer");
        const result = await client.predict("/predict", { image: file });

        const outputObj = result.data[0];
        let all = outputObj.confidences;
        all = all.sort((a, b) => b.confidence - a.confidence);

        const topPred = all[0];
        let output = `<h3 style="color:#4CAF50;">Top Prediction: ${topPred.label} (${(topPred.confidence * 100).toFixed(2)}%)</h3>`;
        output += "<h4 style='color:#ccc;'>Top 5 Predictions:</h4>";

        all.slice(0, 5).forEach((p, i) => {
          const percent = (p.confidence * 100).toFixed(2);
          const barColor = i === 0 ? "#4CAF50" : "#888";
          output += `
            <div style="margin:10px 0;">
              <b style="color:#fff;">${p.label}</b>: ${percent}%
              <div class="confidence-bar">
                <div class="confidence-fill" style="width:${percent}%; background:${barColor};"></div>
              </div>
            </div>
          `;
        });

        resultDiv.innerHTML = output;
      } catch (err) {
        console.error(err);
        resultDiv.innerText = "Error: " + err.message;
      }
    }

    window.predictBird = predictBird;
  </script>
</head>

<body>
  <div style="max-width: 600px; margin: 0 auto;">
    <h1>🐦 BD Iconic Bird Recognizer</h1>
    <p>Upload an image of a bird and get its prediction:</p>

    <input type="file" id="imageUpload" accept="image/*"><br>
    <button onclick="predictBird()">Predict</button>

    <img id="preview"><br>
    <div id="result"></div>
  </div>

  <div style="text-align: center; margin-top: 30px;">
  <a href="index.html">
    <button style="padding: 10px 20px; font-size: 16px; background-color: #555; color: white; border: none; border-radius: 5px; cursor: pointer;">
      ⬅️ Back to Gallery
    </button>
  </a>
  </div>

</body>
</html>
